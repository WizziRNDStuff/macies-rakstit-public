<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vārdi</title>
<style>
  :root{
    --ink:#000; --paper:#fff; --guide:#9a9a9a; --bw:3px;
  }
  :root[data-theme="color"]{ --ink:#3730a3; --paper:#f4f8ff; --guide:#f59e0b; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-text-size-adjust:100%;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);}

  header{display:flex;align-items:center;gap:clamp(8px,2vw,14px);
    padding:clamp(6px,1.6vmin,14px) clamp(10px,2.5vw,22px);
    border-bottom:var(--bw) solid var(--ink);flex:0 0 auto;}
  header .title{font-size:clamp(16px,3.4vmin,24px);font-weight:800;
    flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .prog{font-size:clamp(13px,2.6vmin,20px);font-weight:700;
    white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .iconbtn{font-size:clamp(18px,3.4vmin,26px);line-height:1;font-weight:700;
    padding:clamp(4px,1vmin,8px) clamp(8px,1.6vw,12px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(8px,1.4vmin,12px);cursor:pointer;flex:0 0 auto;
    touch-action:manipulation;}
  .iconbtn:active,.iconbtn.active{background:var(--ink);color:var(--paper);}

  /* action bar (top, so a resting wrist can't hit it — same as raksti) */
  #actionbar{display:flex;flex-wrap:nowrap;gap:clamp(6px,1.2vw,14px);
    align-items:center;justify-content:center;
    padding:clamp(8px,1.6vmin,14px) clamp(6px,1.5vw,18px);
    border-bottom:var(--bw) solid var(--ink);flex:0 0 auto;}
  #actionbar button{flex:1 1 0;min-width:0;white-space:nowrap;
    font-size:clamp(14px,2.6vmin,22px);font-weight:700;
    padding:clamp(9px,1.6vmin,14px) clamp(6px,1.5vw,18px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(9px,1.6vmin,14px);cursor:pointer;touch-action:manipulation;}
  #actionbar button:active{background:var(--ink);color:var(--paper);}

  #stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;
    justify-content:center;padding:clamp(12px,3vmin,30px);}
  /* the syllable card — bordered like the reference, accent per syllable */
  #card{--accent:var(--ink);
    width:min(94%,640px);border:var(--bw) solid var(--accent);
    border-radius:clamp(14px,3vmin,26px);background:var(--paper);
    padding:clamp(8px,2vmin,20px);
    display:flex;align-items:center;justify-content:center;}
  #syl{display:block;width:100%;height:auto;overflow:visible;}
  .glyph{fill:none;stroke:var(--ink);stroke-width:3.4;
    stroke-linecap:round;stroke-linejoin:round;}
  .ptext{font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    font-size:100px;font-weight:500;fill:var(--ink);}
  /* Doman method: big red words, black border, no baseline */
  #card.doman .glyph{stroke:#e11d48;stroke-width:4.2;}
  #card.doman .ptext{fill:#e11d48;}
  .uline{fill:none;stroke:var(--accent);stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round;}
  .udot{fill:var(--accent);}

  /* drawer (left) */
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;
    opacity:0;pointer-events:none;transition:opacity .22s ease;}
  #backdrop.open{opacity:1;pointer-events:auto;}
  #menu{position:fixed;top:0;left:0;bottom:0;z-index:20;width:min(88vw,340px);
    background:var(--paper);border-right:var(--bw) solid var(--ink);
    display:flex;flex-direction:column;transform:translateX(-100%);
    visibility:hidden;transition:transform .22s ease, visibility 0s linear .22s;}
  #menu.open{transform:translateX(0);visibility:visible;
    transition:transform .22s ease, visibility 0s;}
  @media (prefers-reduced-motion:reduce){ #menu,#backdrop{transition:none;} }
  .menu-head{display:flex;align-items:center;gap:clamp(8px,2vw,14px);flex:0 0 auto;
    padding:clamp(8px,1.8vmin,14px) clamp(10px,2.5vw,18px);
    padding-top:calc(clamp(8px,1.8vmin,14px) + env(safe-area-inset-top));
    border-bottom:var(--bw) solid var(--ink);}
  .menu-head .t{font-size:clamp(15px,3vmin,22px);font-weight:800;flex:1 1 auto;
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .menu-body{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;
    padding:clamp(10px,2.4vmin,18px);
    padding-bottom:calc(clamp(10px,2.4vmin,18px) + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:clamp(12px,2.6vmin,18px);}
  .cbtn{font-size:clamp(14px,2.4vmin,19px);font-weight:700;text-align:center;
    text-decoration:none;padding:clamp(9px,1.8vmin,13px) clamp(10px,2vw,16px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(9px,1.6vmin,13px);cursor:pointer;touch-action:manipulation;
    display:block;}
  .cbtn:active,.cbtn.active{background:var(--ink);color:var(--paper);}
  .lbl{font-size:clamp(12px,2vmin,16px);font-weight:700;color:var(--guide);
    text-transform:uppercase;letter-spacing:.5px;}
  .row{display:flex;gap:clamp(6px,1.4vw,10px);}
  .row .cbtn{flex:1 1 0;min-width:0;}
  .ver{margin-top:auto;text-align:center;color:var(--guide);
    font-size:clamp(11px,1.8vmin,14px);padding-top:clamp(8px,2vmin,14px);
    font-variant-numeric:tabular-nums;}
  /* ⓘ info buttons + popup */
  .infobtn{width:clamp(18px,3vmin,24px);height:clamp(18px,3vmin,24px);min-width:0;
    padding:0;flex:0 0 auto;border-radius:50%;border:2px solid var(--guide);
    background:var(--paper);color:var(--guide);
    font:italic 700 clamp(11px,1.9vmin,14px)/1 Georgia,serif;
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    touch-action:manipulation;}
  .infobtn:active{background:var(--guide);color:var(--paper);}
  #infoPop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);
    display:none;align-items:center;justify-content:center;padding:clamp(10px,4vmin,30px);}
  #infoPop.open{display:flex;}
  .info-card{background:var(--paper);border:var(--bw) solid var(--ink);
    border-radius:clamp(10px,2vmin,18px);max-width:min(90vw,430px);max-height:80vh;
    overflow-y:auto;touch-action:pan-y;padding:clamp(12px,3vmin,22px);}
  .info-card .ih{display:flex;align-items:center;gap:10px;
    border-bottom:var(--bw) solid var(--ink);padding-bottom:clamp(6px,1.5vmin,10px);
    margin-bottom:clamp(8px,2vmin,12px);}
  .info-card .ih .t{font-size:clamp(16px,3.2vmin,22px);font-weight:800;flex:1 1 auto;min-width:0;}
  .info-card p{margin:0 0 clamp(8px,2vmin,12px);font-size:clamp(14px,2.6vmin,18px);line-height:1.45;}
  .info-card p:last-child{margin-bottom:0;}
  /* Burtu izmērs slider (touch-action:auto — body sets none for the canvas era) */
  #sizeRange{-webkit-appearance:none;appearance:none;background:transparent;
    touch-action:auto;cursor:pointer;width:100%;height:clamp(20px,3.4vmin,28px);margin:0;}
  #sizeRange::-webkit-slider-runnable-track{height:var(--bw);background:var(--ink);border-radius:2px;}
  #sizeRange::-moz-range-track{height:var(--bw);background:var(--ink);border-radius:2px;}
  #sizeRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:clamp(18px,3.2vmin,26px);height:clamp(18px,3.2vmin,26px);border-radius:50%;
    background:var(--paper);border:var(--bw) solid var(--ink);
    margin-top:calc(var(--bw)/2 - clamp(18px,3.2vmin,26px)/2);}
  #sizeRange::-moz-range-thumb{width:clamp(18px,3.2vmin,26px);height:clamp(18px,3.2vmin,26px);
    border-radius:50%;background:var(--paper);border:var(--bw) solid var(--ink);box-sizing:border-box;}
</style>
<script>
  try { if (localStorage.getItem("lv_theme") === "color")
          document.documentElement.dataset.theme = "color"; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="menuBtn" aria-label="Izvēlne"
            aria-controls="menu" aria-expanded="false">☰</button>
    <div class="title">Vārdi</div>
    <div class="prog" id="prog">1 / 1</div>
  </header>
  <nav id="actionbar">
    <button id="prev">◀ Atpakaļ</button>
    <button id="next">Tālāk ▶</button>
  </nav>
  <div id="stage">
    <div id="card">
      <svg id="syl" preserveAspectRatio="xMidYMid meet" role="img"></svg>
    </div>
  </div>
</div>

<div id="backdrop"></div>
<aside id="menu" aria-labelledby="menuTitle">
  <div class="menu-head">
    <button class="iconbtn" id="menuClose" aria-label="Aizvērt">✕</button>
    <span class="t" id="menuTitle">Izvēlne</span>
  </div>
  <div class="menu-body">
    <a class="cbtn" href="index.html">🏠 Sākums</a>
    <div>
      <div class="row" style="align-items:center"><span class="lbl" style="flex:1 1 auto">Rakstīti burti</span><button class="infobtn" data-info="burti" aria-label="Skaidrojums">i</button></div>
      <div class="row" style="margin-top:8px">
        <button class="cbtn" data-case="upper">ABC</button>
        <button class="cbtn" data-case="lower">abc</button>
      </div>
    </div>
    <div>
      <div class="row" style="align-items:center"><span class="lbl" style="flex:1 1 auto">Drukāti burti</span><button class="infobtn" data-info="burti" aria-label="Skaidrojums">i</button></div>
      <div class="row" style="margin-top:8px">
        <button class="cbtn" data-case="pupper">ABC</button>
        <button class="cbtn" data-case="plower">abc</button>
      </div>
    </div>
    <div>
      <div class="row" style="align-items:center"><span class="lbl" style="flex:1 1 auto">Burtu izmērs</span><button class="infobtn" data-info="izmers" aria-label="Skaidrojums">i</button></div>
      <div class="row" style="margin-top:8px">
        <input type="range" id="sizeRange" min="60" max="100" step="5" value="100" aria-label="Burtu izmērs">
      </div>
    </div>
    <div>
      <div class="row" style="align-items:center"><span class="lbl" style="flex:1 1 auto">Vārdi</span><button class="infobtn" data-info="nejausi" aria-label="Skaidrojums">i</button></div>
      <div class="row" style="margin-top:8px">
        <button class="cbtn" id="randBtn" aria-pressed="false">🎲 Nejauši</button>
      </div>
    </div>
    <div>
      <div class="row" style="align-items:center"><span class="lbl" style="flex:1 1 auto">Domana princips</span><button class="infobtn" data-info="doman" aria-label="Skaidrojums">i</button></div>
      <div class="row" style="margin-top:8px">
        <button class="cbtn" id="domanBtn" aria-pressed="false">🔴 Domana princips</button>
      </div>
    </div>
    <div>
      <div class="row" style="align-items:center"><span class="lbl" style="flex:1 1 auto">Ekrāns</span><button class="infobtn" data-info="ekrans" aria-label="Skaidrojums">i</button></div>
      <div class="row" style="margin-top:8px">
        <button class="cbtn" data-theme-btn="eink">E-tinte</button>
        <button class="cbtn" data-theme-btn="color">Krāsains</button>
      </div>
    </div>
    <div class="ver" id="appVer"></div>
  </div>
</aside>

<div id="infoPop">
  <div class="info-card">
    <div class="ih"><span class="t" id="infoTitle"></span><button class="iconbtn" id="infoClose" aria-label="Aizvērt">✕</button></div>
    <div id="infoBody"></div>
  </div>
</div>

<script src="letters.js?v=9b28e35"></script>
<script>
"use strict";
(function () {
  var APPV = "9b28e35";
  var SVGNS = "http://www.w3.org/2000/svg";
  // Latvian words (uppercase), in the given order
  var SYL = ["ACS","AITA","AKA","ALGA","ASTE","AUSS","BĀKA","BITE","BIZE","DESA","EGLE","EZIS","FEJA","GOVS","IELA","INDE","JAKA","JŪRA","KĀJA","KŪLA","LAPA","ĻIPA","MAMMA","MATI","MĀJA","MĀSA","MĒLE","MUTE","NAGI","OGLE","OLIS","OME","OTA","PELE","PĪLE","POGA","PUĶE","PUPA","PŪCE","PŪKA","RASA","RATI","RĪSI","ROKA","ROZE","SĒTA","SOMA","SULA","SUNS","TAKA","TĒJA","TĒTIS","UPE","VĀLE","VĪLE","ZĀLE","ZEME","ZĪLE","ZOBI","ZUPA"];

  // char -> entry for both handwriting cases (letters.js). Latvian letters
  // case-map correctly with toUpperCase/toLowerCase (standard Unicode pairs).
  var ENT_U = {}, ENT_L = {};
  LETTERS_UPPER.forEach(function (e) { ENT_U[e.char] = e; });
  LETTERS_LOWER.forEach(function (e) { ENT_L[e.char] = e; });

  // colourful accents, cycled per card (e-ink stays --ink via CSS)
  var PALETTE = ["#e11d48", "#2563eb", "#16a34a", "#f59e0b", "#0e7490", "#9333ea"];

  var svg  = document.getElementById("syl");
  var card = document.getElementById("card");
  var prog = document.getElementById("prog");
  var GAP = 7, PAD = 8, ULINE = 6;   // letter gap, viewbox pad, underline drop
  // fixed design canvas -> uniform card size; content is centred inside,
  // so a short item (e.g. "fo") sits normal-sized with margin, not zoomed.
  var CANVAS_W = 330, CANVAS_H = 118;

  // display style: handwritten "upper" / "lower", or "print" (standard font,
  // shown in the list's natural case). Per-page key, remembered independently.
  var mode = localStorage.getItem("lv_var_case") || "pupper";
  if (["upper", "lower", "pupper", "plower"].indexOf(mode) < 0) mode = "pupper";

  var idx = parseInt(localStorage.getItem("lv_var") || "0", 10);
  if (!(idx >= 0 && idx < SYL.length)) idx = 0;

  function groupFor(ch, table) {
    var g = document.createElementNS(SVGNS, "g");
    var e = table[ch];
    if (e) strokesFor(e).forEach(function (d) {
      var p = document.createElementNS(SVGNS, "path");
      p.setAttribute("d", d);
      p.setAttribute("class", "glyph");
      g.appendChild(p);
    });
    return g;
  }

  function render() {
    var raw = SYL[idx];
    var isPrint = (mode === "pupper" || mode === "plower");
    var upper = (mode === "upper" || mode === "pupper");
    var text = upper ? raw.toUpperCase() : raw.toLowerCase();
    prog.textContent = (idx + 1) + " / " + SYL.length;
    svg.setAttribute("aria-label", text);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var totalW, yTop, yBot;
    if (isPrint) {
      // printed letters: one standard-font text node, measured like the glyphs
      var t = document.createElementNS(SVGNS, "text");
      t.setAttribute("class", "ptext");
      t.setAttribute("x", 0); t.setAttribute("y", 0);
      t.textContent = text;
      svg.appendChild(t);
      var tb = t.getBBox();
      t.setAttribute("transform", "translate(" + (-tb.x) + "," + (-tb.y) + ")");
      totalW = tb.width; yTop = 0; yBot = tb.height;
    } else {
      // handwriting: one group per letter, packed left->right by measured width.
      // getBBox is exact because the stage is visible when this runs.
      var table = upper ? ENT_U : ENT_L;
      var cursor = 0; yTop = Infinity; yBot = -Infinity;
      text.split("").forEach(function (ch) {
        var g = groupFor(ch, table); svg.appendChild(g);
        var b = g.getBBox();
        g.setAttribute("transform", "translate(" + (cursor - b.x) + ",0)");
        cursor += b.width + GAP;
        if (b.y < yTop) yTop = b.y;
        if (b.y + b.height > yBot) yBot = b.y + b.height;
      });
      totalW = cursor - GAP;
    }
    var uy = yBot + ULINE;

    // directional underline (hidden in Doman mode)
    if (!domanOn) {
        var dot = document.createElementNS(SVGNS, "circle");
        dot.setAttribute("cx", 0); dot.setAttribute("cy", uy);
        dot.setAttribute("r", 2.6); dot.setAttribute("class", "udot");
        svg.appendChild(dot);
        var ln = document.createElementNS(SVGNS, "path");
        ln.setAttribute("d", "M0," + uy + " L" + totalW + "," + uy);
        ln.setAttribute("class", "uline");
        svg.appendChild(ln);
        var ah = document.createElementNS(SVGNS, "path");
        ah.setAttribute("d", "M" + (totalW - 6) + "," + (uy - 4) +
                        " L" + totalW + "," + uy + " L" + (totalW - 6) + "," + (uy + 4));
        ah.setAttribute("class", "uline");
        svg.appendChild(ah);
    }

    // uniform card: fixed canvas, expanded only if an item is wider than it
    // (aspect kept constant so every card renders the same size)
    var vbW = Math.max(CANVAS_W, totalW + 2 * PAD);
    var vbH = vbW * CANVAS_H / CANVAS_W;
    var vbX = totalW / 2 - vbW / 2;
    var vbY = (yTop + uy) / 2 - vbH / 2;
    svg.setAttribute("viewBox", vbX + " " + vbY + " " + vbW + " " + vbH);

    if (domanOn) card.style.setProperty("--accent", "#000");   // Doman: black border
    else if (document.documentElement.dataset.theme === "color")
      card.style.setProperty("--accent", PALETTE[idx % PALETTE.length]);
    else card.style.removeProperty("--accent");

    localStorage.setItem("lv_var", String(idx));
  }

  // Nejauši is a MODE toggle: when on, Tālāk picks a random syllable.
  // A small history lets Atpakaļ return to what was actually shown.
  var randOn = localStorage.getItem("lv_var_rand") === "1";
  var domanOn = localStorage.getItem("lv_var_doman") === "1";
  var hist = [idx], hpos = 0;

  function show(i) { idx = i; render(); }
  function randomOther() {
    if (SYL.length < 2) return idx;
    var n = idx;
    while (n === idx) n = Math.floor(Math.random() * SYL.length);
    return n;
  }
  function next() {
    if (hpos < hist.length - 1) { hpos++; show(hist[hpos]); return; }  // forward in history
    var n = randOn ? randomOther() : (idx + 1) % SYL.length;
    hist.push(n);
    if (hist.length > 400) hist.shift();   // bound the session history
    hpos = hist.length - 1;
    show(n);
  }
  function prev() {
    if (hpos > 0) { hpos--; show(hist[hpos]); return; }               // back through history
    var n = randOn ? randomOther() : (idx - 1 + SYL.length) % SYL.length;
    hist.unshift(n); hpos = 0;
    show(n);
  }

  document.getElementById("prev").addEventListener("click", prev);
  document.getElementById("next").addEventListener("click", next);

  var randBtn = document.getElementById("randBtn");
  function updateRandBtn() { randBtn.classList.toggle("active", randOn); }
  randBtn.addEventListener("click", function () {
    randOn = !randOn;
    localStorage.setItem("lv_var_rand", randOn ? "1" : "0");
    updateRandBtn();   // stays in the drawer so the on/off state is visible
  });

  // drawer
  var menu = document.getElementById("menu");
  var backdrop = document.getElementById("backdrop");
  var menuBtn = document.getElementById("menuBtn");
  var menuOpen = false;
  function setMenu(open) {
    menuOpen = open;
    menu.classList.toggle("open", open);
    backdrop.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    menuBtn.classList.toggle("active", open);
  }
  menuBtn.addEventListener("click", function () { setMenu(!menuOpen); });
  document.getElementById("menuClose").addEventListener("click", function () { setMenu(false); });
  backdrop.addEventListener("click", function () { setMenu(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && infoPop.classList.contains("open")) infoPop.classList.remove("open");
    else if (e.key === "Escape" && menuOpen) setMenu(false);
    else if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
  });

  // theme toggle (shared lv_theme; re-render to recolour the accent)
  function applyTheme() {
    var color = localStorage.getItem("lv_theme") === "color";
    if (color) document.documentElement.dataset.theme = "color";
    else document.documentElement.removeAttribute("data-theme");
    document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
      b.classList.toggle("active", (b.dataset.themeBtn === "color") === color);
    });
    render();
  }
  document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
    b.addEventListener("click", function () {
      localStorage.setItem("lv_theme", b.dataset.themeBtn === "color" ? "color" : "eink");
      applyTheme();
    });
  });

  function updateCaseBtns() {
    document.querySelectorAll("[data-case]").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-case") === mode);
    });
  }
  document.querySelectorAll("[data-case]").forEach(function (b) {
    b.addEventListener("click", function () {
      mode = b.getAttribute("data-case");
      localStorage.setItem("lv_var_case", mode);
      updateCaseBtns();
      render();
    });
  });

  // Burtu izmērs — scales the whole card 60–100% (shared: lv_flsize)
  var appEl = document.getElementById("app");
  var stageEl = document.getElementById("stage");
  var sizeRange = document.getElementById("sizeRange");
  var sizeV = parseInt(localStorage.getItem("lv_flsize") || "100", 10);
  if (!(sizeV >= 60 && sizeV <= 100)) sizeV = 100;
  // Fit the card to the available stage (bounded by BOTH width and height so
  // it never overflows), scaled by the slider. 100% = as big as fits, so the
  // letters are large on a PC monitor and on the BOOX alike.
  function applySize() {
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    appEl.style.height = Math.round(vh) + "px";       // dvh is unreliable on e-ink
    var r = stageEl.getBoundingClientRect();
    var aspect = CANVAS_W / CANVAS_H;
    var base = Math.min(r.width * 0.98, r.height * 0.95 * aspect);
    if (base > 0) card.style.width = Math.round(base * (sizeV / 100)) + "px";
  }
  sizeRange.value = sizeV;
  sizeRange.addEventListener("input", function () {
    sizeV = parseInt(sizeRange.value, 10);
    localStorage.setItem("lv_flsize", String(sizeV));
    applySize();
  });
  var rzt;
  function onFit() { clearTimeout(rzt); rzt = setTimeout(applySize, 120); }
  window.addEventListener("resize", onFit);
  window.addEventListener("orientationchange", function () { setTimeout(applySize, 250); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", onFit);
  window.addEventListener("load", function () { setTimeout(applySize, 300); });

  // ⓘ explanations
  var INFO = {
    burti: { t: "Burti", p: [
      "ABC / abc — rakstītie burti (kā raksta ar roku), lielie vai mazie.",
      "Drukāti — kā burti izskatās grāmatā."] },
    nejausi: { t: "Nejauši", p: [
      "Ieslēdz nejaušo secību — tad ▶ rāda nejaušu, nevis nākamo pēc kārtas.",
      "Nospied vēlreiz, lai izslēgtu."] },
    izmers: { t: "Burtu izmērs", p: [
      "Cik lieli burti redzami ekrānā."] },
    ekrans: { t: "Ekrāns", p: [
      "E-tinte — augsts kontrasts (melns/balts) e-tintes planšetēm.",
      "Krāsains — dzīvīgas krāsas parastiem (LED/OLED) ekrāniem."] },
    doman: { t: "Domana princips", p: [
      "Lasīšanas metode maziem bērniem: liels vārds sarkanā krāsā uz balta.",
      "Ieslēdz — burti kļūst sarkani, rāmis melns, svītra pazūd. Nospied vēlreiz, lai izslēgtu."] },
  };
  var infoPop = document.getElementById("infoPop");
  var infoTitle = document.getElementById("infoTitle");
  var infoBody = document.getElementById("infoBody");
  function openInfo(key) {
    var inf = INFO[key]; if (!inf) return;
    infoTitle.textContent = inf.t;
    infoBody.textContent = "";
    inf.p.forEach(function (line) {
      var el = document.createElement("p"); el.textContent = line; infoBody.appendChild(el);
    });
    infoPop.classList.add("open");
  }
  document.querySelectorAll(".infobtn").forEach(function (b) {
    b.addEventListener("click", function () { openInfo(b.getAttribute("data-info")); });
  });
  document.getElementById("infoClose").addEventListener("click", function () {
    infoPop.classList.remove("open");
  });
  infoPop.addEventListener("click", function (e) {
    if (e.target === infoPop) infoPop.classList.remove("open");
  });

  var domanBtn = document.getElementById("domanBtn");
  function updateDomanBtn() {
    domanBtn.classList.toggle("active", domanOn);
    card.classList.toggle("doman", domanOn);
  }
  domanBtn.addEventListener("click", function () {
    domanOn = !domanOn;
    localStorage.setItem("lv_var_doman", domanOn ? "1" : "0");
    updateDomanBtn();
    render();
  });

  document.getElementById("appVer").textContent = "Versija: " + APPV;
  updateRandBtn();
  updateCaseBtns();
  updateDomanBtn();
  applySize();
  applyTheme();   // also does the first render
})();
</script>
</body>
</html>
