<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zilbes</title>
<style>
  :root{
    --ink:#000; --paper:#fff; --guide:#9a9a9a; --bw:3px;
  }
  :root[data-theme="color"]{ --ink:#3730a3; --paper:#f4f8ff; --guide:#f59e0b; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;
    -webkit-text-size-adjust:100%;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);}

  header{display:flex;align-items:center;gap:clamp(8px,2vw,14px);
    padding:clamp(6px,1.6vmin,14px) clamp(10px,2.5vw,22px);
    border-bottom:var(--bw) solid var(--ink);flex:0 0 auto;}
  header .title{font-size:clamp(16px,3.4vmin,24px);font-weight:800;
    flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .prog{font-size:clamp(13px,2.6vmin,20px);font-weight:700;
    white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .iconbtn{font-size:clamp(18px,3.4vmin,26px);line-height:1;font-weight:700;
    padding:clamp(4px,1vmin,8px) clamp(8px,1.6vw,12px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(8px,1.4vmin,12px);cursor:pointer;flex:0 0 auto;
    touch-action:manipulation;}
  .iconbtn:active,.iconbtn.active{background:var(--ink);color:var(--paper);}

  /* action bar (top, so a resting wrist can't hit it — same as raksti) */
  #actionbar{display:flex;flex-wrap:nowrap;gap:clamp(6px,1.2vw,14px);
    align-items:center;justify-content:center;
    padding:clamp(8px,1.6vmin,14px) clamp(6px,1.5vw,18px);
    border-bottom:var(--bw) solid var(--ink);flex:0 0 auto;}
  #actionbar button{flex:1 1 0;min-width:0;white-space:nowrap;
    font-size:clamp(14px,2.6vmin,22px);font-weight:700;
    padding:clamp(9px,1.6vmin,14px) clamp(6px,1.5vw,18px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(9px,1.6vmin,14px);cursor:pointer;touch-action:manipulation;}
  #actionbar button:active{background:var(--ink);color:var(--paper);}

  #stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;
    justify-content:center;padding:clamp(12px,3vmin,30px);}
  /* the syllable card — bordered like the reference, accent per syllable */
  #card{--accent:var(--ink);
    width:min(94%,640px);border:var(--bw) solid var(--accent);
    border-radius:clamp(14px,3vmin,26px);background:var(--paper);
    padding:clamp(14px,4vmin,40px) clamp(16px,5vw,54px);
    display:flex;align-items:center;justify-content:center;}
  #syl{display:block;width:100%;height:auto;overflow:visible;}
  .glyph{fill:none;stroke:var(--ink);stroke-width:3.4;
    stroke-linecap:round;stroke-linejoin:round;}
  .uline{fill:none;stroke:var(--accent);stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round;}
  .udot{fill:var(--accent);}

  /* drawer (left) */
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;
    opacity:0;pointer-events:none;transition:opacity .22s ease;}
  #backdrop.open{opacity:1;pointer-events:auto;}
  #menu{position:fixed;top:0;left:0;bottom:0;z-index:20;width:min(88vw,340px);
    background:var(--paper);border-right:var(--bw) solid var(--ink);
    display:flex;flex-direction:column;transform:translateX(-100%);
    visibility:hidden;transition:transform .22s ease, visibility 0s linear .22s;}
  #menu.open{transform:translateX(0);visibility:visible;
    transition:transform .22s ease, visibility 0s;}
  @media (prefers-reduced-motion:reduce){ #menu,#backdrop{transition:none;} }
  .menu-head{display:flex;align-items:center;gap:clamp(8px,2vw,14px);flex:0 0 auto;
    padding:clamp(8px,1.8vmin,14px) clamp(10px,2.5vw,18px);
    padding-top:calc(clamp(8px,1.8vmin,14px) + env(safe-area-inset-top));
    border-bottom:var(--bw) solid var(--ink);}
  .menu-head .t{font-size:clamp(15px,3vmin,22px);font-weight:800;flex:1 1 auto;
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .menu-body{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;
    padding:clamp(10px,2.4vmin,18px);
    padding-bottom:calc(clamp(10px,2.4vmin,18px) + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:clamp(12px,2.6vmin,18px);}
  .cbtn{font-size:clamp(14px,2.4vmin,19px);font-weight:700;text-align:center;
    text-decoration:none;padding:clamp(9px,1.8vmin,13px) clamp(10px,2vw,16px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(9px,1.6vmin,13px);cursor:pointer;touch-action:manipulation;
    display:block;}
  .cbtn:active,.cbtn.active{background:var(--ink);color:var(--paper);}
  .lbl{font-size:clamp(12px,2vmin,16px);font-weight:700;color:var(--guide);
    text-transform:uppercase;letter-spacing:.5px;}
  .row{display:flex;gap:clamp(6px,1.4vw,10px);}
  .row .cbtn{flex:1 1 0;min-width:0;}
  .ver{margin-top:auto;text-align:center;color:var(--guide);
    font-size:clamp(11px,1.8vmin,14px);padding-top:clamp(8px,2vmin,14px);
    font-variant-numeric:tabular-nums;}
</style>
<script>
  try { if (localStorage.getItem("lv_theme") === "color")
          document.documentElement.dataset.theme = "color"; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="menuBtn" aria-label="Izvēlne"
            aria-controls="menu" aria-expanded="false">☰</button>
    <div class="title">Zilbes</div>
    <div class="prog" id="prog">1 / 1</div>
  </header>
  <nav id="actionbar">
    <button id="prev">◀ Atpakaļ</button>
    <button id="next">Tālāk ▶</button>
  </nav>
  <div id="stage">
    <div id="card">
      <svg id="syl" preserveAspectRatio="xMidYMid meet" role="img"></svg>
    </div>
  </div>
</div>

<div id="backdrop"></div>
<aside id="menu" aria-labelledby="menuTitle">
  <div class="menu-head">
    <button class="iconbtn" id="menuClose" aria-label="Aizvērt">✕</button>
    <span class="t" id="menuTitle">Izvēlne</span>
  </div>
  <div class="menu-body">
    <a class="cbtn" href="index.html">🏠 Sākums</a>
    <div>
      <span class="lbl">Zilbes</span>
      <div class="row" style="margin-top:8px">
        <button class="cbtn" id="randBtn">🎲 Nejauši</button>
      </div>
    </div>
    <div>
      <span class="lbl">Ekrāns</span>
      <div class="row" style="margin-top:8px">
        <button class="cbtn" data-theme-btn="eink">E-tinte</button>
        <button class="cbtn" data-theme-btn="color">Krāsains</button>
      </div>
    </div>
    <div class="ver" id="appVer"></div>
  </div>
</aside>

<script src="letters.js?v=7ab8c11"></script>
<script>
"use strict";
(function () {
  var APPV = "7ab8c11";
  var SVGNS = "http://www.w3.org/2000/svg";
  var CONS = "b c č d f g ģ h j k ķ l ļ m n ņ p r s š t v z ž".split(" ");
  var VOW  = "a ā e ē i ī o u ū".split(" ");
  // syllables consonant-major, matching the reference list order
  var SYL = [];
  CONS.forEach(function (c) { VOW.forEach(function (v) { SYL.push(c + v); }); });

  // char -> lowercase entry (from letters.js LETTERS_LOWER)
  var ENTRY = {};
  LETTERS_LOWER.forEach(function (e) { ENTRY[e.char] = e; });

  // colourful accents, cycled per syllable (e-ink stays --ink via CSS)
  var PALETTE = ["#e11d48", "#2563eb", "#16a34a", "#f59e0b", "#0e7490", "#9333ea"];

  var svg  = document.getElementById("syl");
  var card = document.getElementById("card");
  var prog = document.getElementById("prog");
  var GAP = 7, PAD = 8, ULINE = 6;   // letter gap, viewbox pad, underline drop

  var idx = parseInt(localStorage.getItem("lv_zil") || "0", 10);
  if (!(idx >= 0 && idx < SYL.length)) idx = 0;

  function groupFor(ch) {
    var g = document.createElementNS(SVGNS, "g");
    var strokes = strokesFor(ENTRY[ch]);   // path "d" strings, 0..100 coords
    strokes.forEach(function (d) {
      var p = document.createElementNS(SVGNS, "path");
      p.setAttribute("d", d);
      p.setAttribute("class", "glyph");
      g.appendChild(p);
    });
    return g;
  }

  function render() {
    var syl = SYL[idx];
    prog.textContent = (idx + 1) + " / " + SYL.length;
    svg.setAttribute("aria-label", syl);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var g1 = groupFor(syl[0]), g2 = groupFor(syl.slice(1));
    svg.appendChild(g1); svg.appendChild(g2);
    // getBBox needs the elements laid out; the stage is visible so this is exact
    var b1 = g1.getBBox(), b2 = g2.getBBox();
    var o1 = -b1.x;
    var o2 = (b1.width + GAP) - b2.x;
    g1.setAttribute("transform", "translate(" + o1 + ",0)");
    g2.setAttribute("transform", "translate(" + o2 + ",0)");

    var totalW = b1.width + GAP + b2.width;
    var yTop = Math.min(b1.y, b2.y);
    var yBot = Math.max(b1.y + b1.height, b2.y + b2.height);
    var uy = yBot + ULINE;

    // directional underline: start dot (left) + line + arrowhead (right)
    var dot = document.createElementNS(SVGNS, "circle");
    dot.setAttribute("cx", 0); dot.setAttribute("cy", uy);
    dot.setAttribute("r", 2.6); dot.setAttribute("class", "udot");
    svg.appendChild(dot);
    var ln = document.createElementNS(SVGNS, "path");
    ln.setAttribute("d", "M0," + uy + " L" + totalW + "," + uy);
    ln.setAttribute("class", "uline");
    svg.appendChild(ln);
    var ah = document.createElementNS(SVGNS, "path");
    ah.setAttribute("d", "M" + (totalW - 6) + "," + (uy - 4) +
                    " L" + totalW + "," + uy + " L" + (totalW - 6) + "," + (uy + 4));
    ah.setAttribute("class", "uline");
    svg.appendChild(ah);

    var vbX = -PAD, vbY = yTop - PAD;
    var vbW = totalW + 2 * PAD, vbH = (uy + 4 + PAD) - vbY;
    svg.setAttribute("viewBox", vbX + " " + vbY + " " + vbW + " " + vbH);

    // accent: cycle in colourful mode, plain --ink in e-ink
    if (document.documentElement.dataset.theme === "color")
      card.style.setProperty("--accent", PALETTE[idx % PALETTE.length]);
    else card.style.removeProperty("--accent");

    localStorage.setItem("lv_zil", String(idx));
  }

  function go(n) { idx = (n + SYL.length) % SYL.length; render(); }

  document.getElementById("prev").addEventListener("click", function () { go(idx - 1); });
  document.getElementById("next").addEventListener("click", function () { go(idx + 1); });
  document.getElementById("randBtn").addEventListener("click", function () {
    var n = idx;
    while (n === idx && SYL.length > 1) n = Math.floor(Math.random() * SYL.length);
    setMenu(false); go(n);
  });

  // drawer
  var menu = document.getElementById("menu");
  var backdrop = document.getElementById("backdrop");
  var menuBtn = document.getElementById("menuBtn");
  var menuOpen = false;
  function setMenu(open) {
    menuOpen = open;
    menu.classList.toggle("open", open);
    backdrop.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    menuBtn.classList.toggle("active", open);
  }
  menuBtn.addEventListener("click", function () { setMenu(!menuOpen); });
  document.getElementById("menuClose").addEventListener("click", function () { setMenu(false); });
  backdrop.addEventListener("click", function () { setMenu(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && menuOpen) setMenu(false);
    else if (e.key === "ArrowRight") go(idx + 1);
    else if (e.key === "ArrowLeft") go(idx - 1);
  });

  // theme toggle (shared lv_theme; re-render to recolour the accent)
  function applyTheme() {
    var color = localStorage.getItem("lv_theme") === "color";
    if (color) document.documentElement.dataset.theme = "color";
    else document.documentElement.removeAttribute("data-theme");
    document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
      b.classList.toggle("active", (b.dataset.themeBtn === "color") === color);
    });
    render();
  }
  document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
    b.addEventListener("click", function () {
      localStorage.setItem("lv_theme", b.dataset.themeBtn === "color" ? "color" : "eink");
      applyTheme();
    });
  });

  document.getElementById("appVer").textContent = "Versija: " + APPV;
  applyTheme();   // also does the first render
})();
</script>
</body>
</html>
