<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atņemšana</title>
<style>
  :root{ --ink:#000; --paper:#fff; --guide:#9a9a9a; --ok:#0a7d24; --bad:#b00020; --bw:3px; }
  :root[data-theme="color"]{ --ink:#3730a3; --paper:#f4f8ff; --guide:#f59e0b; --ok:#16a34a; --bad:#e11d48; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-text-size-adjust:100%;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);}

  header{display:flex;align-items:center;gap:clamp(8px,2vw,14px);
    padding:clamp(6px,1.6vmin,14px) clamp(10px,2.5vw,22px);
    border-bottom:var(--bw) solid var(--ink);flex:0 0 auto;}
  header .title{font-size:clamp(16px,3.4vmin,24px);font-weight:800;
    flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .score{font-size:clamp(14px,2.8vmin,20px);font-weight:700;white-space:nowrap;
    font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .iconbtn{font-size:clamp(18px,3.4vmin,26px);line-height:1;font-weight:700;
    padding:clamp(4px,1vmin,8px) clamp(8px,1.6vw,12px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(8px,1.4vmin,12px);cursor:pointer;flex:0 0 auto;touch-action:manipulation;}
  .iconbtn:active,.iconbtn.active{background:var(--ink);color:var(--paper);}

  /* equation */
  #stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
    position:relative;padding:clamp(10px,3vmin,28px);}
  #eq{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.5vw,26px);
    font-weight:800;font-size:clamp(48px,16vmin,150px);line-height:1;
    font-variant-numeric:tabular-nums;}
  #ans{min-width:1.1em;text-align:center;border-bottom:clamp(4px,1vmin,8px) solid var(--guide);
    color:var(--guide);}
  #ans.good{color:var(--ok);border-color:var(--ok);}
  #ans.bad{color:var(--bad);border-color:var(--bad);}
  /* success / retry tick */
  #fx{position:absolute;top:clamp(6px,2vmin,16px);right:clamp(10px,3vw,26px);
    font-size:clamp(30px,7vmin,60px);line-height:1;opacity:0;transition:opacity .15s;}
  #fx.show{opacity:1;}
  #fx.good{color:var(--ok);} #fx.bad{color:var(--bad);}

  /* number pad 1..10 */
  #pad{flex:0 0 auto;border-top:var(--bw) solid var(--ink);
    padding:clamp(8px,1.8vmin,16px) clamp(8px,2vw,18px);
    display:grid;gap:clamp(6px,1.4vw,12px);
    grid-template-columns:repeat(5,1fr);}
  @media (min-width:620px){ #pad{grid-template-columns:repeat(10,1fr);} }
  .num{font-size:clamp(20px,4.4vmin,34px);font-weight:800;font-variant-numeric:tabular-nums;
    padding:clamp(10px,2vmin,18px) 0;border:var(--bw) solid var(--ink);
    background:var(--paper);color:var(--ink);border-radius:clamp(9px,1.6vmin,14px);
    cursor:pointer;touch-action:manipulation;}
  .num:active{background:var(--ink);color:var(--paper);}
  .num.wrong{background:var(--bad);border-color:var(--bad);color:var(--paper);}
  .num.right{background:var(--ok);border-color:var(--ok);color:var(--paper);}

  /* drawer */
  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;
    opacity:0;pointer-events:none;transition:opacity .22s ease;}
  #backdrop.open{opacity:1;pointer-events:auto;}
  #menu{position:fixed;top:0;left:0;bottom:0;z-index:20;width:min(88vw,340px);
    background:var(--paper);border-right:var(--bw) solid var(--ink);
    display:flex;flex-direction:column;transform:translateX(-100%);visibility:hidden;
    transition:transform .22s ease, visibility 0s linear .22s;}
  #menu.open{transform:translateX(0);visibility:visible;transition:transform .22s ease, visibility 0s;}
  @media (prefers-reduced-motion:reduce){ #menu,#backdrop{transition:none;} }
  .menu-head{display:flex;align-items:center;gap:clamp(8px,2vw,14px);flex:0 0 auto;
    padding:clamp(8px,1.8vmin,14px) clamp(10px,2.5vw,18px);
    padding-top:calc(clamp(8px,1.8vmin,14px) + env(safe-area-inset-top));
    border-bottom:var(--bw) solid var(--ink);}
  .menu-head .t{font-size:clamp(15px,3vmin,22px);font-weight:800;flex:1 1 auto;min-width:0;}
  .menu-body{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;
    padding:clamp(10px,2.4vmin,18px);
    padding-bottom:calc(clamp(10px,2.4vmin,18px) + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:clamp(12px,2.6vmin,18px);}
  .cbtn{font-size:clamp(14px,2.4vmin,19px);font-weight:700;text-align:center;text-decoration:none;
    padding:clamp(9px,1.8vmin,13px) clamp(10px,2vw,16px);border:var(--bw) solid var(--ink);
    background:var(--paper);color:var(--ink);border-radius:clamp(9px,1.6vmin,13px);
    cursor:pointer;touch-action:manipulation;display:block;}
  .cbtn:active,.cbtn.active{background:var(--ink);color:var(--paper);}
  .lbl{font-size:clamp(12px,2vmin,16px);font-weight:700;color:var(--guide);
    text-transform:uppercase;letter-spacing:.5px;}
  .row{display:flex;gap:clamp(6px,1.4vw,10px);}
  .row .cbtn{flex:1 1 0;min-width:0;}
  .ver{margin-top:auto;text-align:center;color:var(--guide);font-size:clamp(11px,1.8vmin,14px);
    padding-top:clamp(8px,2vmin,14px);font-variant-numeric:tabular-nums;}

  /* write-the-answer pad (handwritten, recognised against the expected number) */
  [hidden]{display:none!important;}
  #writepad{flex:0 0 auto;border-top:var(--bw) solid var(--ink);
    display:flex;flex-direction:column;gap:clamp(6px,1.4vmin,12px);
    padding:clamp(8px,1.8vmin,16px) clamp(8px,2vw,18px);}
  #wframe{position:relative;width:100%;height:clamp(120px,30vh,300px);
    border:var(--bw) solid var(--ink);border-radius:clamp(10px,2vmin,18px);
    background:#fff;overflow:hidden;}
  #wcanvas{position:absolute;inset:0;width:100%;height:100%;
    border-radius:inherit;touch-action:none;}
  #wbtns{display:flex;gap:clamp(6px,1.4vw,12px);}
  .wbtn{flex:1 1 0;min-width:0;font-size:clamp(16px,3vmin,24px);font-weight:800;
    padding:clamp(10px,2vmin,16px) 0;border:var(--bw) solid var(--ink);
    background:var(--paper);color:var(--ink);border-radius:clamp(9px,1.6vmin,14px);
    cursor:pointer;touch-action:manipulation;}
  .wbtn:active{background:var(--ink);color:var(--paper);}
  .wbtn.ok{border-color:var(--ok);color:var(--ok);}
  .wbtn.ok:active{background:var(--ok);color:#fff;}
</style>
<script>
  try { if (localStorage.getItem("lv_theme") === "color")
          document.documentElement.dataset.theme = "color"; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="menuBtn" aria-label="Izvēlne" aria-controls="menu" aria-expanded="false">☰</button>
    <div class="title">Atņemšana</div>
    <div class="score" id="score">✓ 0</div>
  </header>
  <div id="stage">
    <div id="eq">
      <span id="a">0</span><span id="op">−</span><span id="b">0</span>
      <span>=</span><span id="ans">?</span>
    </div>
    <div id="fx"></div>
  </div>
  <div id="pad"></div>
  <div id="writepad" hidden>
    <div id="wframe"><canvas id="wcanvas"></canvas></div>
    <div id="wbtns">
      <button class="wbtn" id="wclear" type="button">Dzēst</button>
      <button class="wbtn ok" id="wcheck" type="button">✓ Pārbaudīt</button>
    </div>
  </div>
</div>

<div id="backdrop"></div>
<aside id="menu" aria-labelledby="menuTitle">
  <div class="menu-head">
    <button class="iconbtn" id="menuClose" aria-label="Aizvērt">✕</button>
    <span class="t" id="menuTitle">Izvēlne</span>
  </div>
  <div class="menu-body">
    <a class="cbtn" href="index.html">🏠 Sākums</a>
    <div>
      <span class="lbl">Atbilde</span>
      <div class="row" style="margin-top:8px">
        <button class="cbtn" data-mode="choose">Izvēlēties</button>
        <button class="cbtn" data-mode="write">Rakstīt</button>
      </div>
    </div>
    <div>
      <span class="lbl">Ekrāns</span>
      <div class="row" style="margin-top:8px">
        <button class="cbtn" data-theme-btn="eink">E-tinte</button>
        <button class="cbtn" data-theme-btn="color">Krāsains</button>
      </div>
    </div>
    <div class="ver" id="appVer"></div>
  </div>
</aside>

<script src="letters.js?v=9b28e35"></script>
<script src="recognize.js?v=9b28e35"></script>
<script>
"use strict";
(function () {
  var APPV = "9b28e35";
  var OP = "sub";   // "add" or "sub"
  var aEl = document.getElementById("a"), bEl = document.getElementById("b");
  var ansEl = document.getElementById("ans"), fxEl = document.getElementById("fx");
  var pad = document.getElementById("pad"), scoreEl = document.getElementById("score");
  var ans = 0, busy = false, correct = 0, lastKey = "";

  function rnd(n) { return Math.floor(Math.random() * n); }   // 0..n-1

  function newProblem() {
    var a, b, key, guard = 0;
    do {
      if (OP === "add") {          // a,b >= 1, sum <= 10
        a = 1 + rnd(8);            // 1..8
        b = 1 + rnd(10 - a);       // 1..(10-a)  -> a+b in 2..10
        ans = a + b;
      } else {                      // subtraction, a<=10, result 1..a-1
        a = 2 + rnd(9);            // 2..10
        b = 1 + rnd(a - 1);        // 1..a-1     -> result 1..9
        ans = a - b;
      }
      key = a + "_" + b;
    } while (key === lastKey && ++guard < 8);   // avoid immediate repeat
    lastKey = key;
    aEl.textContent = a; bEl.textContent = b;
    ansEl.textContent = "?"; ansEl.className = "";
    busy = false;
    clearWrite();
  }

  function flash(el, cls, ms) {
    el.classList.add(cls);
    setTimeout(function () { el.classList.remove(cls); }, ms);
  }

  // shared verdict feedback, used by both the number pad and the write pad
  function onCorrect(shown) {
    busy = true;
    correct++; scoreEl.textContent = "✓ " + correct;
    ansEl.textContent = shown; ansEl.className = "good";
    fxEl.textContent = "✓"; fxEl.className = "show good";
    beep(660);
    setTimeout(function () { fxEl.className = ""; newProblem(); }, 900);
  }
  function onWrong() {
    flash(ansEl, "bad", 400);
    fxEl.textContent = "✗"; fxEl.className = "show bad";
    setTimeout(function () { fxEl.className = ""; }, 500);
    beep(150);
  }

  function answer(n, btn) {
    if (busy) return;
    if (n === ans) {
      btn.classList.add("right");
      setTimeout(function () { btn.classList.remove("right"); }, 900);
      onCorrect(n);
    } else {
      // wrong: flash the tapped key red, brief buzz, let the child retry
      flash(btn, "wrong", 500);
      onWrong();
    }
  }

  // number pad 1..10
  for (var i = 1; i <= 10; i++) {
    (function (n) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "num"; b.textContent = n;
      b.addEventListener("click", function () { answer(n, b); });
      pad.appendChild(b);
    })(i);
  }

  // ---------- write-the-answer mode ----------
  // The child writes the answer by hand; DigitRecog checks it against the
  // expected number's shape (recognize.js). Toggle in the drawer: Izvēlēties
  // (the 1..10 row) vs Rakstīt (write it).
  var mode = localStorage.getItem("lv_math_answer") === "write" ? "write" : "choose";
  var writepad = document.getElementById("writepad");
  var wcanvas = document.getElementById("wcanvas");
  var wctx = wcanvas.getContext("2d");
  var wink = [], wcur = null, wdrawing = false, wpid = null, wptype = "", wlast = null;
  var wCssH = 0;

  function penColor() {
    return getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#000";
  }
  function sizeWCanvas() {
    var r = wcanvas.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return;
    var dpr = window.devicePixelRatio || 1;
    wCssH = r.height;
    wcanvas.width = Math.round(r.width * dpr);
    wcanvas.height = Math.round(r.height * dpr);
    wctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    wctx.lineCap = "round"; wctx.lineJoin = "round";
    wctx.lineWidth = Math.max(3, Math.min(r.width, r.height) * 0.035);
    wctx.strokeStyle = penColor();
    redrawWink();
  }
  function drawWStroke(st) {
    if (st.length < 2) return;
    wctx.beginPath();
    wctx.moveTo(st[0].x, st[0].y);
    for (var i = 1; i < st.length; i++) wctx.lineTo(st[i].x, st[i].y);
    wctx.stroke();
  }
  function redrawWink() {
    if (!wcanvas.width) return;
    wctx.clearRect(0, 0, wcanvas.width, wcanvas.height);
    wctx.strokeStyle = penColor();
    wink.forEach(drawWStroke);
    if (wcur) drawWStroke(wcur);
  }
  function clearWrite() {
    wink = []; wcur = null; wdrawing = false;
    if (wcanvas.width) wctx.clearRect(0, 0, wcanvas.width, wcanvas.height);
  }
  function toW(ev) {
    var r = wcanvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  wcanvas.addEventListener("pointerdown", function (ev) {
    if (busy) return;
    ev.preventDefault();
    if (wdrawing) {
      if (ev.pointerType === "pen" && wptype !== "pen") { wdrawing = false; wcur = null; }
      else return;
    }
    wpid = ev.pointerId; wptype = ev.pointerType || ""; wdrawing = true;
    var p = toW(ev); wcur = [p]; wlast = p;
    wctx.strokeStyle = penColor();
  });
  wcanvas.addEventListener("pointermove", function (ev) {
    if (!wdrawing || ev.pointerId !== wpid) return;
    ev.preventDefault();
    var evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : null;
    if (!evs || !evs.length) evs = [ev];
    for (var i = 0; i < evs.length; i++) {
      var p = toW(evs[i]);
      wctx.beginPath(); wctx.moveTo(wlast.x, wlast.y); wctx.lineTo(p.x, p.y); wctx.stroke();
      wcur.push(p); wlast = p;
    }
  });
  function endW(ev) {
    if (!wdrawing || (ev && ev.pointerId !== wpid)) return;
    wdrawing = false;
    if (wcur && wcur.length > 1) wink.push(wcur);
    wcur = null;
  }
  wcanvas.addEventListener("pointerup", endW);
  wcanvas.addEventListener("pointercancel", endW);
  wcanvas.addEventListener("pointerleave", endW);

  function checkWritten() {
    if (busy) return;
    var strokes = wink.filter(function (s) { return s && s.length > 1; });
    if (!strokes.length) { flash(ansEl, "bad", 250); return; }
    // uniform-scale ink into ~0..100 so recognize.js's size gates line up
    var k = 100 / (wCssH || 1);
    var norm = strokes.map(function (st) {
      return st.map(function (p) { return { x: p.x * k, y: p.y * k }; });
    });
    if (DigitRecog.recognize(norm, String(ans))) {
      onCorrect(String(ans));
    } else {
      onWrong();
      setTimeout(clearWrite, 500);   // clear so the next try starts clean
    }
  }
  document.getElementById("wclear").addEventListener("click", clearWrite);
  document.getElementById("wcheck").addEventListener("click", checkWritten);

  function setMode(m) {
    mode = (m === "write") ? "write" : "choose";
    localStorage.setItem("lv_math_answer", mode);
    document.querySelectorAll("[data-mode]").forEach(function (b) {
      b.classList.toggle("active", b.dataset.mode === mode);
    });
    pad.hidden = (mode !== "choose");
    writepad.hidden = (mode !== "write");
    clearWrite();
    if (mode === "write") setTimeout(sizeWCanvas, 30);
  }
  document.querySelectorAll("[data-mode]").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });

  // tiny sound
  var actx = null;
  function beep(freq) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type = "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.4);
      o.start(); o.stop(actx.currentTime + 0.42);
    } catch (e) {}
  }

  // drawer
  var menu = document.getElementById("menu"), backdrop = document.getElementById("backdrop");
  var menuBtn = document.getElementById("menuBtn"), menuOpen = false;
  function setMenu(open) {
    menuOpen = open;
    menu.classList.toggle("open", open);
    backdrop.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    menuBtn.classList.toggle("active", open);
  }
  menuBtn.addEventListener("click", function () { setMenu(!menuOpen); });
  document.getElementById("menuClose").addEventListener("click", function () { setMenu(false); });
  backdrop.addEventListener("click", function () { setMenu(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && menuOpen) { setMenu(false); return; }
    if (mode !== "choose") return;   // the 1..10 keys only drive the number pad
    if (e.key >= "1" && e.key <= "9") {
      var b = pad.children[parseInt(e.key, 10) - 1]; if (b) b.click();
    } else if (e.key === "0") { var t = pad.children[9]; if (t) t.click(); }  // 0 -> 10
  });

  // theme
  function applyTheme() {
    var color = localStorage.getItem("lv_theme") === "color";
    if (color) document.documentElement.dataset.theme = "color";
    else document.documentElement.removeAttribute("data-theme");
    document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
      b.classList.toggle("active", (b.dataset.themeBtn === "color") === color);
    });
    if (mode === "write") redrawWink();   // pen colour follows the theme
  }
  document.querySelectorAll("[data-theme-btn]").forEach(function (b) {
    b.addEventListener("click", function () {
      localStorage.setItem("lv_theme", b.dataset.themeBtn === "color" ? "color" : "eink");
      applyTheme();
    });
  });

  // JS-measured height + canvas sizing (dvh over-reports on some e-ink tablets)
  function layout() {
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.getElementById("app").style.height = Math.round(vh) + "px";
    if (mode === "write") sizeWCanvas();
  }
  var rzTimer = null;
  function onResize() { clearTimeout(rzTimer); rzTimer = setTimeout(layout, 150); }
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", function () { setTimeout(onResize, 250); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);
  window.addEventListener("load", function () { setTimeout(layout, 300); });

  document.getElementById("appVer").textContent = "Versija: " + APPV;
  applyTheme();
  setMode(mode);
  layout();
  newProblem();
})();
</script>
</body>
</html>
