<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lasīt</title>
<style>
  /* reading is always black on white — no colour theme here */
  :root{ --ink:#000; --paper:#fff; --guide:#9a9a9a; --bw:3px; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-text-size-adjust:100%;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);}

  header{display:flex;align-items:center;gap:clamp(8px,2vw,14px);
    padding:clamp(6px,1.6vmin,14px) clamp(10px,2.5vw,22px);
    border-bottom:var(--bw) solid var(--ink);flex:0 0 auto;}
  header .title{font-size:clamp(16px,3.4vmin,24px);font-weight:800;
    flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .count{font-size:clamp(14px,2.8vmin,20px);font-weight:700;white-space:nowrap;
    font-variant-numeric:tabular-nums;}
  .iconbtn{font-size:clamp(18px,3.4vmin,26px);line-height:1;font-weight:700;
    padding:clamp(4px,1vmin,8px) clamp(8px,1.6vw,12px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(8px,1.4vmin,12px);cursor:pointer;flex:0 0 auto;touch-action:manipulation;}
  .iconbtn:active,.iconbtn.active{background:var(--ink);color:var(--paper);}

  nav#bar{display:flex;flex-wrap:nowrap;gap:clamp(6px,1.4vw,12px);align-items:center;
    justify-content:center;padding:clamp(6px,1.4vmin,12px) clamp(6px,1.5vw,18px);
    border-bottom:var(--bw) solid var(--ink);flex:0 0 auto;}
  nav#bar button{flex:1 1 0;min-width:0;white-space:nowrap;font-size:clamp(13px,2.4vmin,20px);
    font-weight:700;padding:clamp(8px,1.4vmin,12px) clamp(4px,1vw,16px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(9px,1.6vmin,14px);cursor:pointer;touch-action:manipulation;}
  nav#bar button:active{background:var(--ink);color:var(--paper);}
  nav#bar .az{flex:0 0 auto;min-width:clamp(44px,10vw,66px);}

  #stage{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(14px,4vmin,40px);}
  #card{width:100%;max-width:760px;display:flex;flex-direction:column;
    align-items:center;gap:clamp(10px,3vmin,26px);}
  #pic{font-size:clamp(64px,18vmin,150px);line-height:1;}
  #lines{align-self:stretch;text-align:center;font-weight:800;letter-spacing:.5px;
    line-height:1.55;font-size:calc(clamp(20px,5.4vmin,42px) * var(--scale,1));}
  #lines div{margin:0 0 .35em;}

  #backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15;
    opacity:0;pointer-events:none;transition:opacity .22s ease;}
  #backdrop.open{opacity:1;pointer-events:auto;}
  #menu{position:fixed;top:0;left:0;bottom:0;z-index:20;width:min(88vw,340px);
    background:var(--paper);border-right:var(--bw) solid var(--ink);
    display:flex;flex-direction:column;transform:translateX(-100%);visibility:hidden;
    transition:transform .22s ease, visibility 0s linear .22s;}
  #menu.open{transform:translateX(0);visibility:visible;transition:transform .22s ease, visibility 0s;}
  @media (prefers-reduced-motion:reduce){ #menu,#backdrop{transition:none;} }
  .menu-head{display:flex;align-items:center;gap:clamp(8px,2vw,14px);flex:0 0 auto;
    padding:clamp(8px,1.8vmin,14px) clamp(10px,2.5vw,18px);
    padding-top:calc(clamp(8px,1.8vmin,14px) + env(safe-area-inset-top));
    border-bottom:var(--bw) solid var(--ink);}
  .menu-head .t{font-size:clamp(15px,3vmin,22px);font-weight:800;flex:1 1 auto;min-width:0;}
  .menu-body{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;
    padding:clamp(10px,2.4vmin,18px);
    padding-bottom:calc(clamp(10px,2.4vmin,18px) + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:clamp(12px,2.6vmin,18px);}
  .cbtn{font-size:clamp(14px,2.4vmin,19px);font-weight:700;text-align:center;text-decoration:none;
    padding:clamp(9px,1.8vmin,13px) clamp(10px,2vw,16px);border:var(--bw) solid var(--ink);
    background:var(--paper);color:var(--ink);border-radius:clamp(9px,1.6vmin,13px);
    cursor:pointer;touch-action:manipulation;display:block;}
  .cbtn:active,.cbtn.active{background:var(--ink);color:var(--paper);}
  .lbl{font-size:clamp(12px,2vmin,16px);font-weight:700;color:var(--guide);
    text-transform:uppercase;letter-spacing:.5px;}
  .row{display:flex;gap:clamp(6px,1.4vw,10px);}
  .row .cbtn{flex:1 1 0;min-width:0;}
  .ver{margin-top:auto;text-align:center;color:var(--guide);font-size:clamp(11px,1.8vmin,14px);
    padding-top:clamp(8px,2vmin,14px);font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="menuBtn" aria-label="Izvēlne" aria-controls="menu" aria-expanded="false">☰</button>
    <div class="title">Lasīt</div>
    <div class="count" id="count">1 / 5</div>
  </header>
  <nav id="bar">
    <button id="prev">◀ Atpakaļ</button>
    <button class="az" id="smaller" aria-label="Mazāki burti">A−</button>
    <button class="az" id="bigger" aria-label="Lielāki burti">A+</button>
    <button id="next">Tālāk ▶</button>
  </nav>
  <div id="stage">
    <div id="card">
      <div id="pic">🐱</div>
      <div id="lines"></div>
    </div>
  </div>
</div>

<div id="backdrop"></div>
<aside id="menu" aria-labelledby="menuTitle">
  <div class="menu-head">
    <button class="iconbtn" id="menuClose" aria-label="Aizvērt">✕</button>
    <span class="t" id="menuTitle">Izvēlne</span>
  </div>
  <div class="menu-body">
    <a class="cbtn" href="index.html">🏠 Sākums</a>
    <div class="ver" id="appVer"></div>
  </div>
</aside>

<script>
"use strict";
(function () {
  var APPV = "74bb240";

  // Short easy-Latvian stories; words split into syllables with "-" for early
  // readers (same style as the reference readers, original texts).
  var STORIES = [
    { pic: "🐱", lines: ["MAN IR KA-ĶIS.", "VIŅŠ IR MAZS.", "KA-ĶIS ĒD ZI-VIS.", "VI-ŅAM PA-TĪK GU-LĒT."] },
    { pic: "🍂", lines: ["Ā-RĀ IR RU-DENS.", "KO-KI IR DZEL-TE-NI.", "LĪST LIE-TUS.", "ES SKRIE-NU MĀ-JĀS."] },
    { pic: "🐶", lines: ["TE IR SUNS.", "VIŅŠ SPĒ-LĒ-JAS AR BUM-BU.", "SUNS SKRIEN ĀT-RI.", "LABS SUNS!"] },
    { pic: "⛄", lines: ["Ā-RĀ SNIEG.", "VISS IR BALTS.", "MĒS SLI-DI-NĀ-MIES.", "IR JAU-KI ZIE-MĀ!"] },
    { pic: "☀️", lines: ["IR RĪTS.", "ES Ē-DU MAI-ZI.", "MAM-MA DZER TĒ-JU.", "LA-BU A-PE-TĪTI!"] },
  ];

  var idx = 0;
  var scale = parseFloat(localStorage.getItem("lv_read_scale") || "1.8");  // default: MAX
  if (!(scale >= 0.6 && scale <= 1.8)) scale = 1.8;

  var picEl = document.getElementById("pic");
  var linesEl = document.getElementById("lines");
  var countEl = document.getElementById("count");
  var card = document.getElementById("card");

  function render() {
    var s = STORIES[idx];
    picEl.textContent = s.pic;
    linesEl.innerHTML = "";
    s.lines.forEach(function (ln) {
      var d = document.createElement("div");
      d.textContent = ln;
      linesEl.appendChild(d);
    });
    countEl.textContent = (idx + 1) + " / " + STORIES.length;
    card.style.setProperty("--scale", scale);
  }
  function go(dir) { idx = (idx + dir + STORIES.length) % STORIES.length; render(); }
  function setScale(v) {
    scale = Math.max(0.6, Math.min(1.8, Math.round(v * 10) / 10));
    localStorage.setItem("lv_read_scale", String(scale));
    card.style.setProperty("--scale", scale);
  }

  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });
  document.getElementById("smaller").addEventListener("click", function () { setScale(scale - 0.1); });
  document.getElementById("bigger").addEventListener("click", function () { setScale(scale + 0.1); });

  // drawer
  var menu = document.getElementById("menu"), backdrop = document.getElementById("backdrop");
  var menuBtn = document.getElementById("menuBtn"), menuOpen = false;
  function setMenu(open) {
    menuOpen = open;
    menu.classList.toggle("open", open); backdrop.classList.toggle("open", open);
    menuBtn.setAttribute("aria-expanded", open ? "true" : "false");
    menuBtn.classList.toggle("active", open);
  }
  menuBtn.addEventListener("click", function () { setMenu(!menuOpen); });
  document.getElementById("menuClose").addEventListener("click", function () { setMenu(false); });
  backdrop.addEventListener("click", function () { setMenu(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && menuOpen) { setMenu(false); return; }
    if (menuOpen) return;
    if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === "+" || e.key === "=") setScale(scale + 0.1);
    else if (e.key === "-") setScale(scale - 0.1);
  });

  document.getElementById("appVer").textContent = "Versija: " + APPV;
  render();
})();
</script>
</body>
</html>
