<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mācāmies!</title>
<style>
  :root{
    /* E-ink (default): high contrast, optimised for e-paper */
    --ink:#000; --paper:#fff; --guide:#9a9a9a;
    --bw:3px; /* border width */
  }
  /* Colourful (LED/OLED): each activity card gets its own accent */
  :root[data-theme="color"]{
    --ink:#3730a3; --paper:#f4f8ff; --guide:#f59e0b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;}
  /* the menu may scroll — unlike the tracing screen it has no canvas to pin */
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);}

  header{display:flex;align-items:center;gap:clamp(8px,2vw,14px);
    padding:clamp(8px,2vmin,16px) clamp(10px,2.5vw,22px);
    border-bottom:var(--bw) solid var(--ink);flex:0 0 auto;}
  header .title{font-size:clamp(18px,4vmin,30px);font-weight:800;
    letter-spacing:.3px;flex:1 1 auto;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .iconbtn{font-size:clamp(16px,3vmin,22px);line-height:1;font-weight:700;
    padding:clamp(5px,1.2vmin,9px) clamp(9px,1.8vw,14px);
    border:var(--bw) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:clamp(8px,1.4vmin,12px);cursor:pointer;
    flex:0 0 auto;touch-action:manipulation;}
  .iconbtn:active{background:var(--ink);color:var(--paper);}

  /* activity cards */
  main{flex:1 1 auto;display:grid;align-content:start;
    gap:clamp(10px,2.5vmin,20px);padding:clamp(12px,3vmin,26px);
    grid-template-columns:repeat(auto-fit,minmax(clamp(135px,38vw,240px),1fr));}
  .card{--accent:var(--ink);
    position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    gap:clamp(6px,1.6vmin,12px);
    min-height:clamp(130px,26vmin,215px);
    padding:clamp(10px,2.5vmin,18px);
    border:var(--bw) solid var(--accent);
    border-radius:clamp(12px,2.4vmin,22px);
    background:var(--paper);color:var(--ink);
    text-decoration:none;touch-action:manipulation;}
  a.card{cursor:pointer;}
  a.card:active{background:var(--accent);}
  a.card:active .cap,a.card:active .ic{color:var(--paper);}
  .card .ic{font-size:clamp(34px,8vmin,64px);line-height:1;}
  .card .cap{font-size:clamp(13px,2.7vmin,20px);font-weight:800;
    text-transform:uppercase;letter-spacing:.4px;color:var(--accent);}
  /* not built yet: visibly inert, never pretends to be tappable */
  .card.soon{opacity:.5;cursor:default;}
  .card .badge{position:absolute;top:clamp(5px,1.2vmin,9px);
    right:clamp(6px,1.4vw,12px);font-size:clamp(10px,1.7vmin,13px);
    font-weight:700;color:var(--guide);border:2px solid var(--guide);
    border-radius:999px;padding:1px 8px;text-transform:none;letter-spacing:0;}

  /* colourful theme: the reference-style palette, one accent per card */
  :root[data-theme="color"] .c1{--accent:#16a34a;}
  :root[data-theme="color"] .c2{--accent:#e11d48;}
  :root[data-theme="color"] .c3{--accent:#f59e0b;}
  :root[data-theme="color"] .c4{--accent:#0e7490;}
  :root[data-theme="color"] .c5{--accent:#9333ea;}

  .ver{flex:0 0 auto;text-align:center;color:var(--guide);
    font-size:clamp(11px,1.8vmin,14px);
    padding:0 clamp(10px,2.5vw,22px) clamp(10px,2.5vmin,18px);
    font-variant-numeric:tabular-nums;}
</style>
<script>
  /* set the theme before first paint so colourful users see no e-ink flash */
  try { if (localStorage.getItem("lv_theme") === "color")
          document.documentElement.dataset.theme = "color"; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="title">Mācāmies! ✏️</div>
    <button class="iconbtn" id="themeBtn" aria-label="Ekrāna režīms">◐</button>
  </header>

  <main>
    <a class="card c1" href="raksti.html">
      <div class="ic">✏️</div>
      <div class="cap">Raksti burtus</div>
    </a>
    <a class="card c5" href="zilbes.html">
      <div class="ic">🔤</div>
      <div class="cap">Zilbes</div>
    </a>
    <div class="card c2 soon">
      <div class="ic">🔢</div>
      <div class="cap">Raksti ciparus</div>
      <div class="badge">Drīzumā</div>
    </div>
    <div class="card c3 soon">
      <div class="ic">➕</div>
      <div class="cap">Saskaitīšana</div>
      <div class="badge">Drīzumā</div>
    </div>
    <div class="card c4 soon">
      <div class="ic">➖</div>
      <div class="cap">Atņemšana</div>
      <div class="badge">Drīzumā</div>
    </div>
  </main>

  <div class="ver">Versija: c4184f4</div>
</div>

<script>
"use strict";
(function () {
  // same lv_theme key as the tracing screen — one setting, both pages
  var btn = document.getElementById("themeBtn");
  btn.addEventListener("click", function () {
    var color = document.documentElement.dataset.theme !== "color";
    if (color) document.documentElement.dataset.theme = "color";
    else document.documentElement.removeAttribute("data-theme");
    try { localStorage.setItem("lv_theme", color ? "color" : "eink"); } catch (e) {}
  });
})();
</script>
</body>
</html>
