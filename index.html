<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mācāmies!</title>
<style>
  :root{
    /* E-ink (default): high contrast, optimised for e-paper */
    --ink:#000; --paper:#fff; --guide:#9a9a9a;
    --bw:3px; /* border width */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;}
  /* the menu may scroll — unlike the tracing screen it has no canvas to pin */
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);}

  header{display:flex;align-items:center;gap:clamp(8px,2vw,14px);
    padding:clamp(8px,2vmin,16px) clamp(10px,2.5vw,22px);
    border-bottom:var(--bw) solid var(--line);flex:0 0 auto;}
  header .title{font-size:clamp(18px,4vmin,30px);font-weight:800;
    letter-spacing:.3px;flex:1 1 auto;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .iconbtn{font-size:clamp(16px,3vmin,22px);line-height:1;font-weight:700;
    padding:clamp(5px,1.2vmin,9px) clamp(9px,1.8vw,14px);
    border:var(--bw) solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:clamp(8px,1.4vmin,12px);cursor:pointer;text-decoration:none;
    flex:0 0 auto;touch-action:manipulation;}
  .iconbtn:active{background:var(--sel);color:var(--onsel);}

  /* activity cards */
  main{flex:1 1 auto;display:grid;align-content:start;
    gap:clamp(10px,2.5vmin,20px);padding:clamp(12px,3vmin,26px);
    grid-template-columns:repeat(auto-fit,minmax(clamp(135px,38vw,240px),1fr));}
  .card{--accent:var(--ink);
    position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    gap:clamp(6px,1.6vmin,12px);
    min-height:clamp(130px,26vmin,215px);
    padding:clamp(10px,2.5vmin,18px);
    border:var(--bw) solid var(--accent);
    border-radius:clamp(12px,2.4vmin,22px);
    background:var(--paper);color:var(--ink);
    text-decoration:none;touch-action:manipulation;}
  a.card{cursor:pointer;}
  a.card:active{background:var(--accent);}
  a.card:active .cap,a.card:active .ic{color:var(--paper);}
  .card .ic{font-size:clamp(34px,8vmin,64px);line-height:1;}
  .card .cap{font-size:clamp(13px,2.7vmin,20px);font-weight:800;
    text-transform:uppercase;letter-spacing:.4px;color:var(--accent);}
  /* not built yet: visibly inert, never pretends to be tappable */
  .card.soon{opacity:.5;cursor:default;}
  .card .badge{position:absolute;top:clamp(5px,1.2vmin,9px);
    right:clamp(6px,1.4vw,12px);font-size:clamp(10px,1.7vmin,13px);
    font-weight:700;color:var(--guide);border:2px solid var(--guide);
    border-radius:999px;padding:1px 8px;text-transform:none;letter-spacing:0;}

  /* Krāsains + Tumšs: one calm accent per card (border + caption only) */
  :root[data-theme] .c1{--accent:#4f9d69;}
  :root[data-theme] .c2{--accent:#d0675f;}
  :root[data-theme] .c3{--accent:#d39a3a;}
  :root[data-theme] .c4{--accent:#3f93a8;}
  :root[data-theme] .c5{--accent:#8f74c4;}
  :root[data-theme] .c6{--accent:#c96a98;}
  :root[data-theme] .c7{--accent:#3f9d92;}
  :root[data-theme] .c8{--accent:#b8932f;}
  :root[data-theme] .c9{--accent:#6a7bc8;}
  :root[data-theme] .c10{--accent:#4c95b8;}
  .card .desc{font-size:clamp(11px,2vmin,14px);font-weight:600;color:var(--guide);
    text-transform:none;letter-spacing:0;line-height:1.3;}

  .ver{flex:0 0 auto;text-align:center;color:var(--guide);
    font-size:clamp(11px,1.8vmin,14px);
    padding:0 clamp(10px,2.5vw,22px) clamp(10px,2.5vmin,18px);
    font-variant-numeric:tabular-nums;}

  /* changelog popup */
  #logPop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);
    display:none;align-items:center;justify-content:center;
    padding:clamp(10px,4vmin,30px);}
  #logPop.show,#themePop.show{display:flex;}
  #themePop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);
    display:none;align-items:center;justify-content:center;
    padding:clamp(10px,4vmin,30px);}
  .theme-opts{display:grid;grid-template-columns:repeat(3,1fr);
    gap:clamp(8px,2vmin,14px);padding:clamp(12px,3vmin,20px);}
  .topt{display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:clamp(6px,1.4vmin,10px);border:var(--bw) solid var(--line);
    border-radius:clamp(10px,2vmin,16px);background:var(--paper);color:var(--ink);
    font:inherit;font-size:clamp(13px,2.4vmin,17px);font-weight:700;
    cursor:pointer;touch-action:manipulation;}
  .topt.active{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel);}
  /* each swatch shows its own theme, whatever is active now */
  .sw{width:100%;aspect-ratio:4/3;border-radius:clamp(8px,1.6vmin,12px);
    display:flex;align-items:center;justify-content:center;
    font:800 clamp(22px,5vmin,36px)/1 "Segoe UI",Arial,Helvetica,sans-serif;}
  .sw-eink{background:#fff;color:#000;border:3px solid #000;}
  .sw-color{background:#faf9f6;color:#24282d;border:3px solid #d8d5ce;
    box-shadow:inset 0 -6px 0 #3a8f87;}
  .sw-dark{background:#1c1e22;color:#e9e7e2;border:3px solid #3d4148;}
  .log-card{background:var(--paper);border:var(--bw) solid var(--line);
    border-radius:clamp(10px,2vmin,18px);max-width:min(94vw,520px);width:100%;
    max-height:84vh;display:flex;flex-direction:column;}
  .log-head{display:flex;align-items:center;gap:10px;flex:0 0 auto;
    border-bottom:var(--bw) solid var(--line);
    padding:clamp(10px,2.4vmin,16px) clamp(12px,3vw,20px);}
  .log-head .t{font-size:clamp(17px,3.4vmin,24px);font-weight:800;
    flex:1 1 auto;min-width:0;}
  .log-body{overflow-y:auto;touch-action:pan-y;padding:clamp(12px,3vmin,20px);
    display:flex;flex-direction:column;gap:clamp(14px,3vmin,22px);}
  .log-group .gh{display:flex;align-items:center;gap:8px;
    margin:0 0 clamp(6px,1.4vmin,10px);}
  .log-group .gh .d{font-size:clamp(14px,2.6vmin,18px);font-weight:800;}
  .log-group .badge2{font-size:clamp(10px,1.7vmin,13px);font-weight:800;
    color:var(--paper);background:var(--ink);border-radius:999px;
    padding:2px 9px;text-transform:uppercase;letter-spacing:.4px;}
  .log-group ul{margin:0;padding:0;list-style:none;
    display:flex;flex-direction:column;gap:clamp(6px,1.4vmin,10px);}
  .log-group li{font-size:clamp(13px,2.5vmin,17px);line-height:1.4;}
  .log-foot{flex:0 0 auto;border-top:var(--bw) solid var(--line);text-align:center;
    color:var(--guide);font-size:clamp(11px,1.8vmin,14px);
    padding:clamp(8px,2vmin,12px);font-variant-numeric:tabular-nums;}
</style>
<link rel="stylesheet" href="theme.css?v=369d27a">
<script src="theme.js?v=369d27a"></script>
</head>
<body>
<div id="app">
  <header>
    <div class="title">Mācāmies! ✏️</div>
    <button class="iconbtn" id="logBtn" aria-label="Jaunumi" title="Jaunumi">🆕</button>
    <a class="iconbtn" id="fbBtn" href="mailto:info@darbnica.com?subject=Atsauksme%20par%20M%C4%81c%C4%81mies"
       aria-label="Atsauksmes" title="Atsauksmes">✉️</a>
    <button class="iconbtn" id="themeBtn" aria-label="Ekrāna režīms">◐</button>
  </header>

  <main>
    <a class="card c1" href="raksti.html">
      <div class="ic">✏️</div>
      <div class="cap">Raksti burtus</div>
    </a>
    <a class="card c5" href="zilbes.html">
      <div class="ic">🔤</div>
      <div class="cap">Zilbes</div>
    </a>
    <a class="card c6" href="vardi.html">
      <div class="ic">📖</div>
      <div class="cap">Vārdi</div>
    </a>
    <a class="card c9" href="lasit.html">
      <div class="ic">📚</div>
      <div class="cap">Lasīt</div>
    </a>
    <a class="card c2" href="cipari.html">
      <div class="ic">🔢</div>
      <div class="cap">Raksti ciparus</div>
    </a>
    <a class="card c3" href="saskaitisana.html">
      <div class="ic">➕</div>
      <div class="cap">Saskaitīšana</div>
    </a>
    <a class="card c4" href="atnemsana.html">
      <div class="ic">➖</div>
      <div class="cap">Atņemšana</div>
    </a>
    <a class="card c8" href="salidzini.html">
      <div class="ic">⚖️</div>
      <div class="cap">Salīdzini</div>
    </a>
    <a class="card c7" href="zimet.html">
      <div class="ic">🎨</div>
      <div class="cap">Zīmēt</div>
    </a>
    <a class="card c10" href="mailto:info@darbnica.com?subject=Atsauksme%20par%20M%C4%81c%C4%81mies">
      <div class="ic">✉️</div>
      <div class="cap">Atsauksmes</div>
      <div class="desc">Ziņo par kļūdām un ieteikumiem</div>
    </a>
  </main>

  <div class="ver">Versija: 369d27a</div>
</div>

<div id="logPop" role="dialog" aria-modal="true" aria-labelledby="logTitle">
  <div class="log-card">
    <div class="log-head">
      <span class="t" id="logTitle">Jaunumi 🆕</span>
      <button class="iconbtn" id="logClose" aria-label="Aizvērt">✕</button>
    </div>
    <div class="log-body" id="logBody"></div>
    <div class="log-foot">Versija: 369d27a</div>
  </div>
</div>

<div id="themePop" role="dialog" aria-modal="true" aria-labelledby="themeTitle">
  <div class="log-card">
    <div class="log-head">
      <span class="t" id="themeTitle">Ekrāns</span>
      <button class="iconbtn" id="themeClose" aria-label="Aizvērt">✕</button>
    </div>
    <div class="theme-opts">
      <button class="topt" data-theme-btn="eink"><span class="sw sw-eink">Aa</span>E-tinte</button>
      <button class="topt" data-theme-btn="color"><span class="sw sw-color">Aa</span>Krāsains</button>
      <button class="topt" data-theme-btn="dark"><span class="sw sw-dark">Aa</span>Tumšs</button>
    </div>
  </div>
</div>

<script>
"use strict";
(function () {
  // screen picker — theme.js applies + remembers the choice (same lv_theme
  // key on every page); the popup stays open so the change is visible
  var themePop = document.getElementById("themePop");
  function openTheme(open) { themePop.classList.toggle("show", open); }
  document.getElementById("themeBtn").addEventListener("click", function () { openTheme(true); });
  document.getElementById("themeClose").addEventListener("click", function () { openTheme(false); });
  themePop.addEventListener("click", function (e) { if (e.target === themePop) openTheme(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") openTheme(false); });

  // ---------- changelog / "Jaunumi" ----------
  // Newest first. When you ship something notable, add a line to the top group
  // (or a new group). Kept here so the home screen is the single source.
  var CHANGELOG = [
    { date: "Oktobris 2026", items: [
      "✍️ Saskaitīšanā, Atņemšanā un Salīdzini atbildi pēc noklusējuma raksta ar roku; arī atbilžu pogas rāda rakstītus ciparus un zīmes.",
      "✍️ Salīdzini: zīmi <, = vai > var arī uzrakstīt ar roku lodziņā starp skaitļiem — Izvēlne → Atbilde → Rakstīt.",
      "✍️ Saskaitīšanā, Atņemšanā un Salīdzini: cipari var būt rakstīti ar roku — Izvēlne → Cipari → Rakstīti.",
      "✍️ Saskaitīšanā un Atņemšanā: “Rakstīt” lodziņš tagad ir tieši aiz “=”, kā uz papīra. Jauns iestatījums Skaitļu izmērs.",
      "💾 Zīmēt: zīmējumu var saglabāt kā attēlu (💾 poga augšā). Dzēšgumijai jauna ikona.",
      "✍️ Zilbēs un Vārdos: rakstītiem un drukātiem burtiem jauna izvēle Abc — pirmais burts lielais, pārējie mazie.",
      "◐ Jauns ekrāna izskats: mierīgāks Krāsains režīms (bez zilganā toņa) un jauns Tumšs režīms. Nospied ◐ sākumā vai Izvēlne → Ekrāns.",
      "🔤 Zilbēs: 5 līmeņi — no vieglām (MA) līdz grūtām (SKRIE): slēgtās zilbes, divskaņi, līdzskaņu kopas. Izvēlne → Līmenis.",
    ] },
    { date: "Septembris 2026", items: [
      "📚 Jauns: Lasīt — mazi stāstiņi ar vieglvārdiem, zilbēs sadalīti lasīšanai.",
      "⚖️ Jauns: Salīdzini — salīdzini divus skaitļus: lielāks, mazāks vai vienāds (< = >).",
      "🔢 Saskaitīšanā un Atņemšanā: izvēlies skaitļu diapazonu — 1–10, 10–20 vai 1–20.",
      "✏️ Burtu atpazīšana “Grūti” līmenī — dators atpazīst tavu rokrakstu, tāpat kā ciparus.",
      "🎨 Jauns: Zīmēt — brīvi zīmē ar pildspalvu, flomāsteru, zīmuli vai otu; maini krāsu un līnijas resnumu, dzēs ar dzēšgumiju.",
      "🔢 Jauns: Raksti ciparus — mācies rakstīt ciparus 0–9 tavā paša rokrakstā.",
      "✍️ Jauns: Saskaitīšanā un Atņemšanā atbildi tagad var arī uzrakstīt ar roku — Izvēlne → Atbilde → Rakstīt.",
    ]},
    { date: "Augusts 2026", items: [
      "➕ ➖ Jauns: Saskaitīšana un Atņemšana līdz 10 ar ciparu rindu.",
      "🔤 Jauns: Zilbes un Vārdi — lasīšanas kartītes no tava rokraksta.",
      "🔠 Vārdos un Zilbēs: rakstītie/drukātie, lielie/mazie burti, Domana princips un izmēra slīdnis.",
    ]},
    { date: "Jūlijs 2026", items: [
      "✏️ Sākums: Raksti burtus — visi latviešu burti tavā rokrakstā.",
      "⚙️ Grūtības līmeņi (Viegli · Vidēji · Grūti), burtu izmēra un zīmuļa iestatījumi.",
      "◐ E-tintes un krāsainais ekrāna režīms.",
    ]},
  ];

  var logPop   = document.getElementById("logPop");
  var logBody  = document.getElementById("logBody");
  var logBtn   = document.getElementById("logBtn");
  var logClose = document.getElementById("logClose");

  function renderLog() {
    logBody.innerHTML = "";
    CHANGELOG.forEach(function (g, gi) {
      var wrap = document.createElement("div");
      wrap.className = "log-group";
      var gh = document.createElement("div");
      gh.className = "gh";
      var d = document.createElement("span");
      d.className = "d"; d.textContent = g.date;
      gh.appendChild(d);
      if (gi === 0) {
        var bd = document.createElement("span");
        bd.className = "badge2"; bd.textContent = "Jaunākais";
        gh.appendChild(bd);
      }
      wrap.appendChild(gh);
      var ul = document.createElement("ul");
      g.items.forEach(function (it) {
        var li = document.createElement("li");
        li.textContent = it;
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
      logBody.appendChild(wrap);
    });
  }
  function openLog(open) { logPop.classList.toggle("show", open); }

  logBtn.addEventListener("click", function () { renderLog(); openLog(true); });
  logClose.addEventListener("click", function () { openLog(false); });
  logPop.addEventListener("click", function (e) { if (e.target === logPop) openLog(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") openLog(false);
  });
})();
</script>
</body>
</html>
